openapi: 3.0.2
info:
  version: LTS 2021
  title: Nuxeo Platform ACL Search API
  termsOfService: https://www.nuxeo.com/about/why-nuxeo/
  contact:
    email: support@nuxeo.com
    url: https://www.nuxeo.com/contact/
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  x-logo:
    url: https://d1q6f0aelx0por.cloudfront.net/product-logos/library-nuxeo-logo.png
  description: '# Nuxeo Platform https://www.nuxeo.com/

    OpenAPI 3.0 Specification for the Nuxeo Platform.'
servers:
- url: https://{host}:{port}/nuxeo/api/v1
  variables:
    host:
      default: demo.nuxeo.com
      description: Nuxeo Platform Host
    port:
      default: '443'
      description: Nuxeo Platform Port
- url: https://nightly.nuxeo.com/nuxeo/api/v1
  description: Nuxeo Platform Nightly Test Server
tags:
- name: Search
  description: Search Operations
paths:
  /id/{docId}/@pp/{pageProviderName}:
    get:
      operationId: DocumentIdPageProviderAdapterGet
      parameters:
      - description: Id of the document
        in: path
        name: docId
        required: true
        schema:
          type: string
      - description: 'Name of the page provider, ex: ''user_domains'''
        in: path
        name: pageProviderName
        required: true
        schema:
          type: string
      - description: Index of the current page
        in: query
        name: currentPageIndex
        required: false
        schema:
          type: string
      - description: Offset of the page to retrieve. If set, the 'currentPageIndex' parameter is ignored.
        in: query
        name: offset
        required: false
        schema:
          type: integer
      - description: Size of the page to retrieve. Ignored if offset set
        in: query
        name: pageSize
        required: false
        schema:
          type: integer
      - description: Maximum results to retrieve
        in: query
        name: maxResults
        required: false
        schema:
          type: integer
      - description: Property to sort by, for example 'dc:title'
        in: query
        name: sortBy
        required: false
        schema:
          type: string
      - description: Sort order, accepts 'asc' or 'desc', default is 'desc'
        in: query
        name: sortOrder
        required: false
        schema:
          type: string
      - description: Schemas to be included in response
        in: header
        name: X-NXDocumentProperties
        required: false
        schema:
          type: string
      - description: Categories to be included in context parameters map
        in: header
        name: X-NXContext-Category
        required: false
        schema:
          type: string
      - description: 'Checkin Document Version. Return the last document version. (not live document) | Values: major or minor or none'
        in: header
        name: X-Versioning-Option
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/documents'
        '401':
          description: Not Authorized to get document
        '404':
          description: Document not found
      description: Only documents which you have permission to see will be returned
      summary: Execute a page provider on document by its id
      tags:
      - Search
  /path/{docPath}/@pp/{pageProviderName}:
    get:
      operationId: DocumentPathPageProviderAdapterGet
      parameters:
      - description: 'Path of the document, ex: ''default-domain'''
        in: path
        name: docPath
        required: true
        schema:
          type: string
      - description: 'Name of the page provider, ex: ''user_domains'''
        in: path
        name: pageProviderName
        required: true
        schema:
          type: string
      - description: Index of the current page
        in: query
        name: currentPageIndex
        required: false
        schema:
          type: integer
      - description: Offset of the page to retrieve. If set, the 'currentPageIndex' parameter is ignored.
        in: query
        name: offset
        required: false
        schema:
          type: integer
      - description: Size of the page to retrieve. Ignored if offset set
        in: query
        name: pageSize
        required: false
        schema:
          type: integer
      - description: Maximum results to retrieve
        in: query
        name: maxResults
        required: false
        schema:
          type: integer
      - description: Property to sort by, for example 'dc:title'
        in: query
        name: sortBy
        required: false
        schema:
          type: string
      - description: Sort order, accepts 'asc' or 'desc', default is 'desc'
        in: query
        name: sortOrder
        required: false
        schema:
          type: string
      - description: Schemas to be included in response
        in: header
        name: X-NXDocumentProperties
        required: false
        schema:
          type: string
      - description: Categories to be included in context parameters map
        in: header
        name: X-NXContext-Category
        required: false
        schema:
          type: string
      - description: 'Checkin Document Version. Return the last document version. (not live document) | Values: major or minor or none'
        in: header
        name: X-Versioning-Option
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/documents'
        '401':
          description: Not Authorized to get document
        '404':
          description: Document not found
      description: Only documents which you have permission to see will be returned
      summary: Execute a page provider on document by its path
      tags:
      - Search
  /query:
    get:
      operationId: QueryGet
      parameters:
      - description: 'The query to perform. (By default: SELECT * FROM Document)'
        in: query
        name: query
        required: false
        schema:
          type: string
      - description: 'The number of entries per page. (By default: 0)'
        in: query
        name: pageSize
        required: false
        schema:
          type: integer
      - description: 'The selected page index. (By default: 0)'
        in: query
        name: currentPageIndex
        required: false
        schema:
          type: integer
      - description: 'The maximum entries. (By default: 200)'
        in: query
        name: maxResults
        required: false
        schema:
          type: integer
      - description: 'Property(ies) sorting. (Example: sortBy=''dc:title,dc:description'')'
        in: query
        name: sortBy
        required: false
        schema:
          type: string
      - description: 'Sort order. (Example: sortOrder=''DESC,ASC'')'
        in: query
        name: sortOrder
        required: false
        schema:
          type: string
      - description: 'Ordered parameters. (Example: for ''Select * From Document where dc:title = ?'' -> queryParams=''titleA'')'
        in: query
        name: queryParams
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/documents'
        '401':
          description: Not Authorized to get document
        '404':
          description: Document not found
      description: You can have also named parameters in the query. See http://doc.nuxeo.com/x/qAc5AQ
      summary: Perform Named Page Provider on the repository
      tags:
      - Search
  /query/{providerName}:
    get:
      operationId: QueryProviderGet
      parameters:
      - description: The page provider name.
        in: path
        name: providerName
        required: true
        schema:
          type: string
      - description: 'The number of entries per page. (By default: 0)'
        in: query
        name: pageSize
        required: false
        schema:
          type: integer
      - description: 'The selected page index. (By default: 0)'
        in: query
        name: currentPageIndex
        required: false
        schema:
          type: integer
      - description: 'The maximum entries. (By default: 200)'
        in: query
        name: maxResults
        required: false
        schema:
          type: integer
      - description: 'Property(ies) sorting. (Example: sortBy=''dc:title,dc:description'')'
        in: query
        name: sortBy
        required: false
        schema:
          type: string
      - description: 'Sort order. (Example: sortOrder=''DESC,ASC'')'
        in: query
        name: sortOrder
        required: false
        schema:
          type: string
      - description: 'Ordered parameters. (Example: for ''Select * From Document where dc:title = ?'' -> queryParams=''titleA'')'
        in: query
        name: queryParams
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/documents'
        '401':
          description: Not Authorized to get document
        '404':
          description: Document not found
      description: You can have also named parameters in the query. See http://doc.nuxeo.com/x/qAc5AQ
      summary: Perform Named Page Provider on the repository
      tags:
      - Search
  /search/lang/{queryLanguage}/bulk/{actionId}:
    post:
      operationId: SearchLangBulkActionPost
      parameters:
      - description: The query language.
        in: path
        name: queryLanguage
        required: true
        schema:
          type: string
      - description: 'The query to perform. (By default: SELECT * FROM Document)'
        in: query
        name: query
        required: false
        schema:
          type: string
      - description: 'Ordered parameters. (Example: for ''Select * From Document where dc:title = ?'' -> queryParams=''titleA'')'
        in: query
        name: queryParams
        required: false
        schema:
          type: string
      - description: Id of the bulk action
        in: path
        name: actionId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/documents'
        '401':
          description: Not Authorized to get document
        '404':
          description: Document not found
      description: You can have also named parameters in the query. See http://doc.nuxeo.com/x/qAc5AQ
      summary: Performs a bulk action on the query result.
      tags:
      - Search
  /search/lang/{queryLanguage}/execute:
    get:
      operationId: SearchLangExecuteGet
