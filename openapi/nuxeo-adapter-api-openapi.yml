      summary: View the audit trail of a document given its id
      tags:
      - Adapter
  /path/{docPath}/@audit:
    get:
      operationId: DocumentPathAuditAdapterGet
      parameters:
      - description: 'Path of the document, ex: ''default-domain'''
        in: path
        name: docPath
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
