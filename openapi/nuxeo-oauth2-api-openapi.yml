            type: string
          type: array
          uniqueItems: false
        serviceName:
          type: string
          uniqueItems: false
        tokenServerURL:
          type: string
          uniqueItems: false
        userAuthorizationURL:
          type: string
          uniqueItems: false
        userId:
          type: string
          uniqueItems: false
